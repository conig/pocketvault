<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e222a"><meta name="description" content="Your vaults, ready to read. A private, read-only Markdown library with offline search.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; style-src-attr 'unsafe-inline'; connect-src 'self' https://api.github.com; img-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer"><link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/katex.css">
<link rel="stylesheet" href="/themes.css">
<script src="/theme-start.js"></script>
<title>Pocket Vault</title>
</head>
<body class="setup">
<header class="topbar"><a class="brand" href="#" aria-label="Pocket Vault home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m7 8 9 8-9 8m13 0h9"/></svg><span>Pocket Vault<span class="brand-caption"></span></span></a><div class="top-actions"><button id="refresh" class="icon-button" title="Refresh from GitHub" aria-label="Refresh from GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.1 8a7.5 7.5 0 0 1 12.4-2L20 9M4 15l2.5 3A7.5 7.5 0 0 0 19 16"/></svg></button><button id="settings" class="icon-button" title="Connection and device settings" aria-label="Connection and device settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg></button></div></header>
<main class="workspace">
<section class="library" aria-label="Note library">
<div class="library-top"><div class="eyebrow">YOUR LIBRARY</div><label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" autocomplete="off" placeholder="Search…" aria-label="Search all your notes"><kbd>/</kbd></label><details class="filter-menu"><summary>Filter</summary><label class="tag-control">Tags <select id="tag-filter" aria-label="Filter by tag"><option value="">All tags</option></select></label><div id="filters" class="filters" role="group" aria-label="Filter by vault"></div></details></div>
<div class="list-heading"><span id="result-count">Your notes live here</span><span id="demo-badge" hidden>Sample library</span></div><div id="note-list" class="note-list"></div>
<footer class="library-footer"><span id="connection-dot" class="dot"></span><span id="sync-status" role="status" aria-live="polite">Not connected</span><button id="apply-update" class="update-button" hidden>Reload update</button></footer>
</section>
<section class="reader" id="reader" aria-label="Note reader"><div id="reader-content"></div></section>
</main>
<div id="notice" class="notice" role="status" hidden></div>
<dialog id="connection-dialog" aria-labelledby="connection-title">
<form id="connection-form">
<div class="dialog-top"><span class="eyebrow">~/vaults</span><button type="button" id="close-settings" class="icon-button" aria-label="Close settings">×</button></div>
<h2 id="connection-title">Connect</h2>
<section class="appearance-settings" aria-label="Appearance">
<label for="theme-select">Theme</label>
<select id="theme-select" aria-describedby="theme-status"><!-- THEME_OPTIONS --></select>
<p id="theme-status" role="status">Applies immediately · saved on this device</p>
</section>
<section id="vault-settings" hidden aria-labelledby="vault-settings-title">
<fieldset class="vault-choices"><legend id="vault-settings-title">Vaults on this device</legend><div id="vault-options"></div></fieldset>

<button type="button" class="primary" id="save-vaults">Save vault selection <span>✓</span></button>
</section>
<details id="connection-details" open><summary>GitHub connection</summary>

<label>Read-only GitHub token <a class="token-help" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer" title="Create a fine-grained token with Contents: read-only">Create ↗</a><input name="token" id="token-input" type="password" autocomplete="off" placeholder="github_pat_…" spellcheck="false"></label>

<label class="checkbox"><input type="checkbox" id="remember-token"><span>Remember token <small>Unencrypted · this device only</small></span></label>
<details id="manual-connection"><summary>Enter a repository manually</summary>
<label>Repository<input name="repo" id="repo-input" placeholder="user/vault" autocomplete="off" spellcheck="false"></label>
<label>Branch <span class="optional">optional</span><input name="branch" id="branch-input" placeholder="Default branch" autocomplete="off" spellcheck="false"></label>
</details>
<p id="discovery-status" role="status" hidden></p>
<button class="primary" id="connect-submit" type="submit">Connect <span>↗</span></button>
</details>

<p id="connection-error" class="error" role="alert" hidden></p>
<details><summary>Device cache & connection</summary><button type="button" class="primary" id="diagnose-device">Check device cache & GitHub</button><pre id="device-diagnostics" role="status" hidden></pre></details>
<button type="button" class="text-button danger" id="forget">Forget this device</button>

</form></dialog>
<dialog id="source-dialog" aria-labelledby="source-title">
<form id="source-form">
<div class="dialog-top"><span class="eyebrow">GITHUB SOURCE</span><button type="button" id="source-back" class="icon-button" aria-label="Back to connection">←</button></div>
<h2 id="source-title">Choose your source</h2>
<label>Repository<select id="repo-select" required></select></label>
<label>Branch<select id="branch-select"></select></label>
<p id="source-status" role="status"></p>
<p id="source-error" class="error" role="alert" hidden></p>
<button class="primary" id="source-submit" type="submit">Open vault <span>↗</span></button>
</form></dialog>
<script type="module" src="/app.js"></script>
</body></html>
